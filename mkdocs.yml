# mkdocs.yml template (English): generated by genera_sito.py with LINGUA=en.
# Do not edit mkdocs.yml by hand.
site_name: Linear Algebra · Fabio Furini
site_description: >-
  Linear Algebra: the course lecture notes online, with definitions,
  worked examples, exercises and an interactive computation lab
  (Gauss, determinants, inverses, linear systems, LU factorization).
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/linear-algebra/
repo_url: https://github.com/fabiofurini/linear-algebra
copyright: >-
  &copy; 2026 Fabio Furini — text, figures and data licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/deed.en">CC BY 4.0</a>,
  code licensed under
  <a href="https://github.com/fabiofurini/linear-algebra/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/matrix
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: material/web
      link: https://sites.google.com/view/fabiofurini/home-page
      name: Fabio Furini — personal website
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza University of Rome
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/operations-research-lab/
      name: Operations Research Lab
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/mip-modelling/
      name: MIP Modelling
    - icon: material/function-variant
      link: https://fabiofurini.github.io/mathematical-analysis-1/
      name: Mathematical Analysis 1
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/algebra-lineare/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/linear-algebra/
      lang: en

extra_css:
  - stylesheets/extra.css?v=6b95240421
  - stylesheets/laboratorio.css?v=4a485df5f4

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js?v=913760528a
  - javascripts/mathjax.js?v=2617f92aed
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/algebra.js?v=351bd892dc
  - javascripts/laboratorio.js?v=d008e88260

