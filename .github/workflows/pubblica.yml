name: Pubblica il sito del corso
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install mkdocs-material sympy
      # il motore di calcolo del laboratorio contro SymPy: ogni risultato e ogni
      # passo intermedio. Se un controllo fallisce, il sito non si pubblica.
      - run: python3 test/genera_casi.py
      - run: node test/test_algebra.js
      # le pagine e le figure sono già generate dai sorgenti LaTeX (in locale):
      # qui si controlla solo che il sito si costruisca senza errori
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
